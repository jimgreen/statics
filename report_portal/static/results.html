<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>运行结果 - 报表控制台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div><div class="eyebrow">REPORT PORTAL / SQLITE</div><h1>报表控制台</h1></div>
    <div class="process-card"><span id="process-dot" class="dot"></span><span id="process-label">调度器加载中</span><span id="active-count" class="process-count">0 个运行任务</span><button class="ghost" data-process="start">启动</button><button class="ghost" data-process="pause">暂停</button><button class="ghost" data-process="resume">恢复</button><button class="ghost" data-process="stop">停止</button></div>
  </header>
  <main class="layout">
    <aside class="sidebar"><div class="sidebar-title"><span>报表定义</span><button id="new-report" class="primary small">＋ 新建</button></div><input id="report-search" type="search" aria-label="搜索报表" placeholder="搜索名称或说明"><div id="report-list" class="report-list"></div><div class="sidebar-foot"><span class="status-pill">● SQLite</span><span id="database-path"></span></div></aside>
    <section class="workspace">
      <div id="workspace-overview" class="workspace-overview" aria-label="报表概况"></div>
      <nav class="page-nav" aria-label="报表功能页面"><a class="" href="/definition">报表定义</a><a class="active" href="/results">运行结果</a><a class="" href="/history">执行历史</a></nav>
            <section id="results-panel" class="panel page-panel">
        <div class="panel-heading"><div><div class="eyebrow">RESULTS</div><h2>报表结果</h2></div><button id="refresh-results" class="ghost">刷新</button></div>
        <div id="result-empty" class="empty" role="status">选择一条成功的运行记录查看结果。</div>
        <div id="result-content" class="hidden">
          <div id="result-meta" class="result-meta"></div>
          <div id="result-metrics" class="metric-grid"></div>
          <div id="result-downloads" class="result-downloads" aria-label="下载完整报表"></div>
          <div id="result-summary" class="summary-box hidden"></div>
          <details id="result-preview" class="editor-section hidden"><summary>完整 HTML 报表预览 <span>点击加载版式和图表</span></summary><div id="result-chart" class="result-chart"></div></details>
          <div class="result-toolbar">
            <label>明细搜索<input id="result-search" type="search" placeholder="搜索所有列的内容"></label>
            <label>排序列<select id="result-sort"><option value="">原始顺序</option></select></label>
            <label>排序方向<select id="result-direction"><option value="asc">升序</option><option value="desc">降序</option></select></label>
            <button id="reset-result-filters" class="ghost small">清除筛选</button>
          </div>
          <div id="result-page-message" class="hint" aria-live="polite"></div>
          <div class="table-wrap result-data"><table id="result-table"><thead></thead><tbody></tbody></table></div>
          <div class="pager"><label>每页<select id="result-page-size" aria-label="明细每页条数"><option>20</option><option selected>50</option><option>100</option><option>200</option></select></label><span id="result-page-info" aria-live="polite"></span><button id="result-prev" class="ghost small">上一页</button><button id="result-next" class="ghost small">下一页</button></div>
        </div>
      </section>

    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="/static/app.js"></script><script src="/static/workbench.js"></script>
</body>
</html>
